[package]
name = "asc-mcp"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Model Context Protocol (MCP) server for Apple App Store Connect"
license-file = "LICENSE"
repository = "https://github.com/antisynthesis/asc-mcp"
readme = "README.md"
publish = false

[[bin]]
name = "asc-mcp"
path = "src/main.rs"

[lib]
name = "asc_mcp"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tower = "0.5"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
clap = { version = "4", features = ["derive", "env"] }
prometheus = { version = "0.14", features = ["process"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
subtle = "2"
futures = "0.3"
bytes = "1"
libc = "0.2"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset", "macros"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
