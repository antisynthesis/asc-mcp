name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo build
        run: cargo build --locked

      - name: cargo test
        run: cargo test --locked

      - name: Build release binary (smoke)
        env:
          ASC_MCP_VERSION: ${{ github.sha }}
        run: |
          cargo build --release --locked
          ./target/release/asc-mcp version
          ./target/release/asc-mcp tools | head -1

  parity:
    name: parity with the Go reference
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the Go reference is built from git history

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Build Go reference
        run: tests/parity/build-go-reference.sh "" target/asc-mcp-go

      - name: Build Rust server
        run: cargo build --locked

      - name: Protocol parity (stdio and HTTP)
        run: python3 tests/parity/protocol.py --go target/asc-mcp-go --rust target/debug/asc-mcp

      - name: Tool parity (every tool, all argument variants and mock modes)
        run: python3 tests/parity/parity.py --go target/asc-mcp-go --rust target/debug/asc-mcp --jobs 4 --max-diffs 2

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit
